[project]
name = "company_ui_theme"
authors = [
    { name = "Community" }
]
description = "Reusable light/dark Desk UI theme for Frappe HRMS v16"
requires-python = ">=3.14"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=16.0.0" # Installed and managed by bench.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

# These apt dependencies will be installed from Ubuntu repositories when you host your app on Frappe Cloud
[deploy.dependencies.apt]
packages = []

# Lint and format settings come from the HRMS repository's root pyproject.toml
# (ruff ignores pyproject.toml files without a [tool.ruff] section).
